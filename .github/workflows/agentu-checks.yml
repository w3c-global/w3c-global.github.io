name: Agentu checks
on:
  pull_request:
    paths: ['agentu/**', '.github/workflows/agentu-*.yml']
  push:
    branches: [main, 'codex/agentu-*']
    paths: ['agentu/**', '.github/workflows/agentu-*.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r agentu/requirements-tools.txt
      - run: python -m unittest discover -s agentu/tests -v
      - run: node --check agentu/site.js && node --check agentu/demo/app.js && node --check agentu/demo/auth.js
      - run: python agentu/scripts/build.py
      - run: cfn-lint .build/template.json
