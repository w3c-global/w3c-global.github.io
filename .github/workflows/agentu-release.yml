name: Release Agentu
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Environment
        required: true
        type: choice
        options: [sandbox, demo]
permissions:
  contents: read
  id-token: write
concurrency:
  group: agentu-release-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: agentu-${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r agentu/requirements-tools.txt
      - run: python -m unittest discover -s agentu/tests -v
      - run: node --check agentu/site.js && node --check agentu/demo/app.js && node --check agentu/demo/auth.js && node --check agentu/app/app.js
      - run: python agentu/scripts/build.py
      - run: cfn-lint .build/template.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: eu-west-2
          allowed-account-ids: '032312375271'
          role-session-name: AgentuGitHubRelease
      - run: python agentu/scripts/release.py --stage "${{ inputs.stage }}"
